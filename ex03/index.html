<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors and Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Colors & Opacity</h1>

    <div class="named">Named Color</div>
    <div class="hex">HEX Color</div>
    <div class="rgb">RGB Color</div>
    <div class="rgba">RGBA Color</div>

    <h2>Opacity vs RGBA</h2>

    <div class="opacity-box">
        <p>Opacity affects this text too.</p>
    </div>

    <div class="rgba-box">
        <p>RGBA keeps this text fully visible.</p>
    </div>

</body>
</html>
